name: Bug report
description: Something is broken, crashes, or behaves differently from what the screen says it will.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If PC Cleaner deleted something it shouldn't have, use the **data loss** form instead — that one is triaged first.

  - type: dropdown
    id: area
    attributes:
      label: Where in the app
      options:
        - Dashboard
        - Junk Files
        - Duplicates
        - Large Files
        - Startup
        - About / updates
        - Appearance (Light/Dark/System)
        - Installing or launching
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Large Files
        2. Add C:\Users\<me>\Downloads
        3. Scan
        4. The row meters are all full width regardless of file size
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2 / macOS 15.2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PC Cleaner version
      description: Shown on the About screen.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The Setup.exe installer
        - Built from source
    validations:
      required: true

  - type: checkboxes
    id: known
    attributes:
      label: Before you file
      description: These are known and documented, so please check whether you're hitting one of them.
      options:
        - label: This isn't a permission error on a system-owned path. Junk under `C:\Windows\...` or `/Library/Caches` needs admin/root, and the app currently reports those as partial failures rather than prompting for elevation.
        - label: This isn't a system-scope startup item. Toggling `HKLM` Run keys or `/Library/LaunchAgents` needs admin/root and is expected to fail without it.
        - label: This isn't the macOS build. Mac Catalyst has never been verified on real hardware (see #4) — reports are welcome, but expect rough edges there.

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error text
      description: For a crash, the error text matters more than a description of it. Paste rather than screenshot where you can.
